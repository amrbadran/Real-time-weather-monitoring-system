name: build and test

on:
  push:
  pull_request:
    branches: [ main, testing_workflow ]
    paths:
      - '**.cs'
      - '**.csproj'

env:
  DOTNET_VERSION: '8.0.x' # The .NET SDK version to use

jobs:
  build-and-test:

    name: build-and-test-${{matrix.os}}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macOS-latest]

    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install dependencies
        run: dotnet restore ./RealTimeWeatherMonitoringSystem/Real-time-weather-monitoring-system.sln

      - name: Build
        run: dotnet build ./RealTimeWeatherMonitoringSystem/Real-time-weather-monitoring-system.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test ./RealTimeWeatherMonitoringSystem/Real-time-weather-monitoring-system.sln --no-restore --verbosity normal